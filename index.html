    // 한국 표준시(KST, UTC+9) 기준 YYYY_MM_DD 날짜 키 생성 (모든 기기·브라우저 통일)
    function getKstTodayUnderscoreKey() {
      const kstNow = new Date(Date.now() + 9 * 60 * 60 * 1000);
      const y = kstNow.getUTCFullYear();
      const m = String(kstNow.getUTCMonth() + 1).padStart(2, '0');
      const d = String(kstNow.getUTCDate()).padStart(2, '0');
      return `${y}_${m}_${d}`;
    }

    // 페이지 파싱 즉시 백그라운드에서 중앙 카운터 API 선요청 시작 (다중 시도 + 자동 재시도)
    (function prewarmVisitorStats() {
      const todayStr = getKstTodayUnderscoreKey();
      const totalKey = 'doha_los_prod_total';
      const todayKey = `doha_los_prod_today_${todayStr}`;

      function fetchWithTimeout(url, ms) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), ms);
        return fetch(url, { method: 'GET', cache: 'no-store', signal: controller.signal })
          .finally(() => clearTimeout(timer));
      }

      async function queryOnce(endpointUrl) {
        const res = await fetchWithTimeout(endpointUrl, 5000);
        if (!res.ok) return null;
        const text = await res.text();
        try {
          const data = JSON.parse(text);
          const num = Number(data?.value);
          if (!Number.isNaN(num) && num >= 0) return num;
        } catch (e) {
          const matches = Array.from(text.matchAll(/>([0-9,]+)</g));
          if (matches.length > 0) {
            const lastNum = Number(matches[matches.length - 1][1].replace(/,/g, ''));
            if (!Number.isNaN(lastNum) && lastNum >= 0) return lastNum;
          }
        }
        return null;
      }

      async function reliableHitKey(key) {
        const safeKey = encodeURIComponent(key);
        const hitUrl = `https://countapi.mileshilliard.com/api/v1/hit/${safeKey}`;
        const getUrl = `https://countapi.mileshilliard.com/api/v1/get/${safeKey}`;

        // 1차 시도: 중앙 카운터 증가 및 조회
        try {
          const val1 = await queryOnce(hitUrl);
          if (val1 !== null && val1 > 0) return val1;
        } catch (e) {}

        // 2차 재시도: 일시적 네트워크 지연 대응
        await new Promise((r) => setTimeout(r, 400));
        try {
          const val2 = await queryOnce(hitUrl);
          if (val2 !== null && val2 > 0) return val2;
        } catch (e) {}

        // 3차 보완: get 엔드포인트로 현재 서버 누적값 직접 조회
        try {
          const val3 = await queryOnce(getUrl);
          if (val3 !== null && val3 > 0) return val3;
        } catch (e) {}

        return null;
      }

      window.__visitorStatsPromise = Promise.all([
        reliableHitKey(totalKey),
        reliableHitKey(todayKey)
      ]);
    })();
  </script>

<script>
  let closeProfilePopup;
  let clearPointC;
  let toggleManualPanel;
  let toastTimer = null;

  // 화면 상단 안내 배너 표시 함수
  function showToast(msg) {
    const el = document.getElementById('toastBanner');
    if (!el) return;
    el.innerText = msg;
    el.style.display = 'block';
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      el.style.display = 'none';
    }, 2600);
  }

  // MGRS 문자열을 해당 그리드 셀의 중심(1m 단위 오차 방지) 위경도로 변환
  function mgrsToCenteredLatLng(mgrsStr) {
    const clean = (mgrsStr || '').replace(/\s+/g, '').toUpperCase();
    const basePt = mgrs.toPoint(clean);
    const lng = basePt[0];
    const lat = basePt[1];

    const match = clean.match(/^[0-9]{1,2}[C-HJ-NP-X][A-HJ-NP-Z]{2}([0-9]*)$/);
    const digitsLen = match && match[1] ? match[1].length : 0;
    const halfDigitsLen = Math.floor(digitsLen / 2);
    const cellSizeMeters = halfDigitsLen > 0 ? Math.pow(10, 5 - halfDigitsLen) : 100000;
    const halfOffsetMeters = cellSizeMeters * 0.5;

    const latRad = (lat * Math.PI) / 180;
    const metersPerLatDeg = 111319.490793;
    const metersPerLngDeg = Math.max(10000, metersPerLatDeg * Math.cos(latRad));

    const centeredLat = lat + (halfOffsetMeters / metersPerLatDeg);
    const centeredLng = lng + (halfOffsetMeters / metersPerLngDeg);
    return L.latLng(centeredLat, centeredLng);
  }

  // 브라우저 화면 자체의 핀치 줌(100% 고정 해제 시도) 차단
  document.addEventListener('gesturestart', function(e) { e.preventDefault(); }, { passive: false });
  document.addEventListener('gesturechange', function(e) { e.preventDefault(); }, { passive: false });
  document.addEventListener('gestureend', function(e) { e.preventDefault(); }, { passive: false });

  // 한국 표준시(KST, UTC+9) 기준 오늘 날짜 키 생성
  function getTodayKey() {
    const kstNow = new Date(Date.now() + 9 * 60 * 60 * 1000);
    const y = kstNow.getUTCFullYear();
    const m = String(kstNow.getUTCMonth() + 1).padStart(2, '0');
    const d = String(kstNow.getUTCDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
  }

  // CountAPI(/api/v1/hit/{key})로 중앙 카운트 증가 및 조회 (타임아웃 + get 보완)
  async function hitCounterKey(key) {
    const safeKey = encodeURIComponent(key);
    for (const endpoint of ['hit', 'get']) {
      try {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 5000);
        const res = await fetch(`https://countapi.mileshilliard.com/api/v1/${endpoint}/${safeKey}`, {
          method: 'GET',
          cache: 'no-store',
          signal: controller.signal
        }).finally(() => clearTimeout(timer));
        if (res.ok) {
          const data = await res.json();
          const num = Number(data?.value);
          if (!Number.isNaN(num) && num > 0) {
            return num;
          }
        }
      } catch (e) {}
    }
    return null;
  }

  // Today / Total 방문자 숫자 표시 (모든 기기·브라우저 중앙 서버 동기화)
  async function loadVisitorStats() {
    if (window.__visitorStatsApplied) return;
    window.__visitorStatsApplied = true;

    const mapText = document.getElementById('visitorMapText');
    const todayStr = getTodayKey().replace(/-/g, '_');
    const totalKey = 'doha_los_prod_total';
    const todayKey = `doha_los_prod_today_${todayStr}`;
    const baseOffset = Math.max(0, Number(APP_CONFIG.baseTotalOffset) || 0);

    let cachedTotal = 0;
    let cachedToday = 0;
    try {
      cachedTotal = parseInt(localStorage.getItem(`${totalKey}_cache`) || '0', 10);
      cachedToday = parseInt(localStorage.getItem(`${todayKey}_cache`) || '0', 10);
    } catch (e) {
      // 스토리지 접근 제한 환경 무시
    }

    // 기존 방문 기록이 있는 기기만 캐시를 즉시 띄우고, 새 기기는 서버 실제 값을 우선 대기 (1로 리셋 방지)
    let finalToday = cachedToday > 0 ? cachedToday : null;
    let finalTotal = cachedTotal > 0 ? cachedTotal + baseOffset : null;

    if (mapText && (finalToday !== null || finalTotal !== null)) {
      const tStr = finalToday !== null ? finalToday.toLocaleString() : '...';
      const totStr = finalTotal !== null ? finalTotal.toLocaleString() : '...';
      mapText.innerHTML = `Today <b>${tStr}</b> &nbsp;·&nbsp; Total <b>${totStr}</b>`;
    }

    // 중앙 서버 응답 반영 (캐시보다 큰 실제 서버 값을 우선 사용)
    try {
      const [remoteTotal, remoteToday] = window.__visitorStatsPromise
        ? await window.__visitorStatsPromise
        : await Promise.all([hitCounterKey(totalKey), hitCounterKey(todayKey)]);

      if (remoteTotal !== null && remoteTotal > 0) {
        const bestTotal = Math.max(remoteTotal, cachedTotal);
        try { localStorage.setItem(`${totalKey}_cache`, String(bestTotal)); } catch (e) {}
        finalTotal = bestTotal + baseOffset;
      }

      if (remoteToday !== null && remoteToday > 0) {
        const bestToday = Math.max(remoteToday, cachedToday);
        try { localStorage.setItem(`${todayKey}_cache`, String(bestToday)); } catch (e) {}
        finalToday = bestToday;
      }
    } catch (e) {
      // 네트워크 오류 시 캐시 유지
    }

    if (mapText) {
      const todayDisplay = finalToday !== null ? finalToday.toLocaleString() : '1';
      const totalDisplay = finalTotal !== null ? finalTotal.toLocaleString() : String(Math.max(1, baseOffset + 1));
      mapText.innerHTML = `Today <b>${todayDisplay}</b> &nbsp;·&nbsp; Total <b>${totalDisplay}</b>`;
    }
  }

  // 목표 축척 분모(예: 1080000)와 위도를 기반으로 가장 근접한 Leaflet 줌 레벨 계산
  function scaleDenominatorToZoom(scaleDenom, lat) {
    const metersPerPixel = scaleDenom / 3779.527559;
    const earthCircumference = 40075016.686;
    const latRad = (lat * Math.PI) / 180;
    const zoom = Math.log2((earthCircumference * Math.cos(latRad)) / (metersPerPixel * 256));
    if (Number.isNaN(zoom) || !Number.isFinite(zoom)) return 9;
    return Math.min(Math.max(zoom, 3), 18);
  }

  // 깔끔한 눈금 거리 계산 (1, 2, 5 단위)
  function getNiceRoundNumber(num) {
    if (!num || num <= 0 || !Number.isFinite(num)) return 100;
    const pow10 = Math.pow(10, Math.floor(Math.log10(num)));
    const d = num / pow10;
    if (d >= 5) return 5 * pow10;
    if (d >= 2) return 2 * pow10;
    return pow10;
  }

    const openManualBtn = document.getElementById('openManualBtn');

    const closeManualBtn = document.getElementById('closeManualBtn');
    if (openManualBtn) {
      openManualBtn.onclick = (e) => {
        e.stopPropagation();
        toggleManualPanel(null, 'manual');
      };
    }
    if (openUpdateBtn) {
      openUpdateBtn.onclick = (e) => {

        toggleManualPanel(null, 'update');
      };

    if (closeManualBtn) {

    const sigEl = document.getElementById('appSignature');
    if (sigEl) {

    }

    loadVisitorStats();

    const controlWrapper = document.getElementById('controlWrapper');
    const resizeHandle = document.getElementById('resizeHandle');
    const baseWidth = 215;
    let currentScale = 1.0;
    try {
      currentScale = parseFloat(localStorage.getItem('doha_ui_scale')) || 1.0;
    } catch (e) {}

    function applyBoxScale(scale) {
      currentScale = Math.min(Math.max(scale, 0.65), 1.6);
      controlWrapper.style.transform = `scale(${currentScale})`;
      try { localStorage.setItem('doha_ui_scale', currentScale); } catch (e) {}
    }
    applyBoxScale(currentScale);

    let isResizing = false;
    let startX = 0, startY = 0, startScale = 1.0;

    function onResizeStart(clientX, clientY) {
      isResizing = true; startX = clientX; startY = clientY; startScale = currentScale;
      resizeHandle.classList.add('active');
    }
    function onResizeMove(clientX, clientY) {
      if (!isResizing) return;
      const dx = clientX - startX, dy = clientY - startY;
      applyBoxScale(startScale + ((dx + dy) * 0.5) / baseWidth);
    }
    function onResizeEnd() {
      if (!isResizing) return;
      isResizing = false;
      resizeHandle.classList.remove('active');
    }

    resizeHandle.addEventListener('mousedown', (e) => { e.preventDefault(); e.stopPropagation(); onResizeStart(e.clientX, e.clientY); });
    window.addEventListener('mousemove', (e) => onResizeMove(e.clientX, e.clientY));
    window.addEventListener('mouseup', onResizeEnd);
    resizeHandle.addEventListener('touchstart', (e) => { e.preventDefault(); e.stopPropagation(); if (e.touches.length === 1) onResizeStart(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });
    window.addEventListener('touchmove', (e) => { if (isResizing) { e.preventDefault(); if (e.touches.length === 1) onResizeMove(e.touches[0].clientX, e.touches[0].clientY); } }, { passive: false });
    window.addEventListener('touchend', onResizeEnd);

    // APP_CONFIG.initialMgrs와 APP_CONFIG.initialScaleRatio로 시작 좌표 및 축척 계산
    let startLat = 37.9;
    let startLng = 127.0;
    try {
      if (typeof mgrs !== 'undefined' && mgrs && typeof mgrs.toPoint === 'function') {
        const cleanMgrs = (APP_CONFIG.initialMgrs || "").replace(/\s+/g, '').toUpperCase();
        if (cleanMgrs.length >= 5) {
          const centered = mgrsToCenteredLatLng(cleanMgrs);
          if (Number.isFinite(centered.lat) && Number.isFinite(centered.lng)) {
            startLat = centered.lat;
            startLng = centered.lng;
          }
        }
      }
    } catch (e) {
      // MGRS 파싱 오류 시 기본 좌표 유지
    }

    const targetScaleDenom = Number(APP_CONFIG.initialScaleRatio) || 1080000;
    const initialZoom = Math.round(scaleDenominatorToZoom(targetScaleDenom, startLat));

    if (typeof L === 'undefined') {
      showToast("지도 라이브러리(Leaflet) 로딩 실패 - 새로고침해 주세요.");
      return;
    }

    const map = L.map('map', {
      zoomControl: false,
      zoomSnap: 1,
      zoomDelta: 1,
      zoomAnimation: true,
      fadeAnimation: true
    }).setView([startLat, startLng], initialZoom);

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Esri',
      maxZoom: 19,
      keepBuffer: 4,
      updateWhenZooming: false
    }).addTo(map);

    const googleRoadOverlay = L.tileLayer('https://mt1.google.com/vt/lyrs=h&hl=ko&x={x}&y={y}&z={z}', {
      attribution: 'Google',
      maxZoom: 20,
      zIndex: 500,
      keepBuffer: 4,
      updateWhenZooming: false
    }).addTo(map);

    setTimeout(() => {
      map.invalidateSize();
    }, 100);

    // 우측 하단 축척 막대 및 1 : OOO 축척 비율 실시간 업데이트
    function updateScaleIndicator() {
      const center = map.getCenter();
      const zoom = map.getZoom();
      const latRad = (center.lat * Math.PI) / 180;
      const metersPerPixel = (40075016.686 * Math.cos(latRad)) / (256 * Math.pow(2, zoom));

      const rawDenom = metersPerPixel * 3779.527559;
      let roundedDenom;
      if (rawDenom >= 100000) {
        roundedDenom = Math.round(rawDenom / 10000) * 10000;
      } else if (rawDenom >= 10000) {
        roundedDenom = Math.round(rawDenom / 1000) * 1000;
      } else {
        roundedDenom = Math.round(rawDenom / 100) * 100;
      }

      const ratioEl = document.getElementById('scaleRatioText');
      if (ratioEl) {
        ratioEl.innerText = `축척 1 : ${Math.max(100, roundedDenom).toLocaleString()}`;
      }

      const maxBarPx = 85;
      const maxMeters = metersPerPixel * maxBarPx;
      const niceMeters = getNiceRoundNumber(maxMeters);
      const barWidthPx = Math.max(24, Math.min(110, Math.round(niceMeters / metersPerPixel)));

      const barEl = document.getElementById('scaleBarLine');
      const distEl = document.getElementById('scaleDistText');
      if (barEl) barEl.style.width = `${barWidthPx}px`;
      if (distEl) {
        distEl.innerText = niceMeters >= 1000
          ? `${(niceMeters / 1000)} km`
          : `${niceMeters} m`;
      }
    }

    map.on('zoom move', updateScaleIndicator);
    updateScaleIndicator();

    // + / - 버튼 연타 시 쿨타임 없이 목표 줌 레벨 누적 및 자연스러운 애니메이션 전환
    let targetZoomLevel = map.getZoom();
    let isButtonZooming = false;

    map.on('zoomend', function() {
      if (isButtonZooming) {
        isButtonZooming = false;
        if (Math.round(map.getZoom()) !== targetZoomLevel) {
          isButtonZooming = true;
          map.setZoom(targetZoomLevel, { animate: true });
        }
      } else {
        targetZoomLevel = Math.round(map.getZoom());
      }
    });

    function handleFastZoom(delta) {
      const minZ = map.getMinZoom();
      const maxZ = map.getMaxZoom();
      targetZoomLevel = Math.min(Math.max(targetZoomLevel + delta, minZ), maxZ);
      isButtonZooming = true;
      map.setZoom(targetZoomLevel, { animate: true });
    }

    const btnZoomIn = document.getElementById('btnZoomIn');
    const btnZoomOut = document.getElementById('btnZoomOut');
    let lastTouchTime = 0;

    btnZoomIn.addEventListener('touchstart', function(e) {
      e.preventDefault();
      e.stopPropagation();
      lastTouchTime = Date.now();
      handleFastZoom(1);
    }, { passive: false });
    btnZoomIn.addEventListener('click', function(e) {
      e.stopPropagation();
      if (Date.now() - lastTouchTime < 400) return;
      handleFastZoom(1);
    });

    btnZoomOut.addEventListener('touchstart', function(e) {
      e.preventDefault();
      e.stopPropagation();
      lastTouchTime = Date.now();
      handleFastZoom(-1);
    }, { passive: false });
    btnZoomOut.addEventListener('click', function(e) {
      e.stopPropagation();
      if (Date.now() - lastTouchTime < 400) return;
      handleFastZoom(-1);
    });

    let isRoadVisible = true;
    document.getElementById('toggleRoadLayer').onclick = function() {
      if (isRoadVisible) {
        map.removeLayer(googleRoadOverlay);
        this.innerText = "한국어 도로/지명: OFF"; this.style.background = "#fff"; this.style.color = "#666"; this.style.borderColor = "#666";
      } else {
        googleRoadOverlay.addTo(map);
        this.innerText = "한국어 도로/지명: ON"; this.style.background = "#f0f4f8"; this.style.color = "#0056b3"; this.style.borderColor = "#0056b3";
      }
      isRoadVisible = !isRoadVisible;
    };

    let aCoord = null, bCoord = null, gpsCoord = null, mode = null;
    let markerA = null, markerB = null, markerGps = null, losLine = null, scrubMarker = null;
    let isCancelled = false;
    let cachedResults = null, cachedDistMeters = 0, persistentIndex = null;
    let isSingleMgrsModeA = false;
    let isSingleMgrsModeB = false;

    // Point A 입력 방식 전환 토글
    document.getElementById('toggleMgrsModeA').onclick = function() {
      isSingleMgrsModeA = !isSingleMgrsModeA;
      const aSplit = document.getElementById('aSplitContainer');
      const aSingle = document.getElementById('aSingleInput');

      if (isSingleMgrsModeA) {
        const aVal = (document.getElementById('aZone').value + document.getElementById('aSq').value + document.getElementById('aEast').value + document.getElementById('aNorth').value).replace(/\s+/g, '');

        aSplit.style.display = 'flex';
        aSingle.style.display = 'none';
        this.innerText = '한줄 입력';
      }

    document.getElementById('toggleMgrsModeB').onclick = function() {
      isSingleMgrsModeB = !isSingleMgrsModeB;

      const bSingle = document.getElementById('bSingleInput');

      if (isSingleMgrsModeB) {
        const bVal = (document.getElementById('bZone').value + document.getElementById('bSq').value + document.getElementById('bEast').value + document.getElementById('bNorth').value).replace(/\s+/g, '');
        if (bVal && bVal !== '52S') bSingle.value = bVal;
        bSplit.style.display = 'none';
        bSingle.style.display = 'block';
        this.innerText = '분할 입력';
      } else {
        if (bSingle.value.trim().length >= 5) fillMgrsSplits('b', bSingle.value.trim());
        bSplit.style.display = 'flex';
        bSingle.style.display = 'none';
        this.innerText = '한줄 입력';
      }
    };

    function clearLosOverlay() {
      if (losLine) { map.removeLayer(losLine); losLine = null; }
      clearPointC();
      document.getElementById('los-popup').style.display = 'none';
    }

    closeProfilePopup = function() {
      clearPointC();
      document.getElementById('los-popup').style.display = 'none';
    };

    clearPointC = function() {
      if (scrubMarker) { map.removeLayer(scrubMarker); scrubMarker = null; }
      persistentIndex = null;
      if (cachedResults && document.getElementById('los-popup').style.display !== 'none') {
        drawProfile(null);
      }
    };

    function fillMgrsSplits(prefix, mgrsStr) {
      mgrsStr = mgrsStr.replace(/\s+/g, '');
      let zone = mgrsStr.substring(0, 3);
      let sq = mgrsStr.substring(3, 5);
      let rest = mgrsStr.substring(5);
      let halfLen = Math.floor(rest.length / 2);
      let east = rest.substring(0, halfLen);
      let north = rest.substring(halfLen);
      if (east.length < 5) east = east.padEnd(5, '0');
      if (north.length < 5) north = north.padEnd(5, '0');

      document.getElementById(prefix + 'Zone').value = zone;
      document.getElementById(prefix + 'Sq').value = sq;
      document.getElementById(prefix + 'East').value = east;
      document.getElementById(prefix + 'North').value = north;
      document.getElementById(prefix + 'SingleInput').value = mgrsStr;
    }

    function updateA(latlng, preserveInput = false) {
      clearLosOverlay();
      if (markerA) map.removeLayer(markerA);
      aCoord = latlng;
      if (!preserveInput) {
        try {
          if (typeof mgrs !== 'undefined' && mgrs.forward) {
            fillMgrsSplits('a', mgrs.forward([latlng.lng, latlng.lat], 5));
          }
        } catch (e) {}
      }
      markerA = L.circleMarker(latlng, {radius:6, color:'red', weight:2, fillOpacity:1}).addTo(map);
    }

    function updateB(latlng, preserveInput = false) {
      clearLosOverlay();
      if (markerB) map.removeLayer(markerB);
      bCoord = latlng;
      if (!preserveInput) {
        try {
          if (typeof mgrs !== 'undefined' && mgrs.forward) {
            fillMgrsSplits('b', mgrs.forward([latlng.lng, latlng.lat], 5));
          }
        } catch (e) {}

      markerB = L.circleMarker(latlng, {radius:6, color:'blue', weight:2, fillOpacity:1}).addTo(map);

    document.getElementById('setA').onclick = () => { mode = 'A'; showToast("지도에서 A지점 위치를 터치하세요."); };
    document.getElementById('setB').onclick = () => { mode = 'B'; showToast("지도에서 B지점 위치를 터치하세요."); };
    document.getElementById('clearA').onclick = () => {
      clearLosOverlay();
      if(markerA) { map.removeLayer(markerA); markerA = null; }

      document.getElementById('aSingleInput').value = '';
      ['aZone','aSq','aEast','aNorth'].forEach(id => document.getElementById(id).value = '');

    document.getElementById('clearB').onclick = () => {
      clearLosOverlay();
      if(markerB) { map.removeLayer(markerB); markerB = null; }
      bCoord = null;
      document.getElementById('bSingleInput').value = '';
      ['bZone','bSq','bEast','bNorth'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('bZone').value = '52S';

    map.on('click', e => {
      if (mode === 'A') { updateA(e.latlng, false); mode = null; }
      else if (mode === 'B') { updateB(e.latlng, false); mode = null; }

    document.getElementById('moveA').onclick = () => {
      try {
        let combined = '';
        if (isSingleMgrsModeA) {
          combined = document.getElementById('aSingleInput').value.replace(/\s+/g, '').toUpperCase();
        } else {
          const zone = document.getElementById('aZone').value.trim();
          const sq = document.getElementById('aSq').value.trim();
          const east = document.getElementById('aEast').value.trim();
          const north = document.getElementById('aNorth').value.trim();
          combined = (zone + sq + east + north).replace(/\s+/g, '').toUpperCase();

        updateA(latlng, true);
        map.setView(latlng, 14);
      } catch(e) {
        showToast("A지점 MGRS 입력 형식 오류 (예: 52SCH1234567890)");
      }
    };

    document.getElementById('moveB').onclick = () => {
      try {
        let combined = '';
        if (isSingleMgrsModeB) {
          combined = document.getElementById('bSingleInput').value.replace(/\s+/g, '').toUpperCase();
        } else {
          const zone = document.getElementById('bZone').value.trim();
          const sq = document.getElementById('bSq').value.trim();
          const east = document.getElementById('bEast').value.trim();
          const north = document.getElementById('bNorth').value.trim();
          combined = (zone + sq + east + north).replace(/\s+/g, '').toUpperCase();
        }
        const latlng = mgrsToCenteredLatLng(combined);
        updateB(latlng, true);
        map.setView(latlng, 14);
      } catch(e) {
        showToast("B지점 MGRS 입력 형식 오류 (예: 52SCH1234567890)");
      }
    };

    document.getElementById('myGps').onclick = () => {
      if (!navigator.geolocation) return showToast("이 기기에서는 GPS를 지원하지 않습니다.");
      const isLocalFile = window.location.protocol === 'file:' || window.location.protocol === 'content:';
      const btnGps = document.getElementById('myGps');
      btnGps.innerText = "위성 신호 수신 중...";
      navigator.geolocation.getCurrentPosition(
        pos => {
          btnGps.innerText = "내 GPS 위치 찾기";
          const latlng = L.latLng(pos.coords.latitude, pos.coords.longitude);
          gpsCoord = latlng;
          if (markerGps) map.removeLayer(markerGps);
          markerGps = L.circleMarker(latlng, {radius:8, color:'#ffcc00', fillColor:'#ffff00', fillOpacity:0.8, weight:3}).addTo(map);
          map.setView(latlng, 15);
          document.getElementById('gpsActionGroup').style.display = 'block';
        },
        () => {
          btnGps.innerText = "내 GPS 위치 찾기";
          showToast(isLocalFile ? "로컬 파일 환경에서는 GPS가 차단됩니다." : "GPS 수신에 실패했습니다.");
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    };

    document.getElementById('gpsToA').onclick = () => {
      if (gpsCoord) {
        updateA(gpsCoord, false);
        showToast("현재 GPS 위치가 Point A로 지정되었습니다.");
      }
    };
    document.getElementById('gpsToB').onclick = () => {
      if (gpsCoord) {
        updateB(gpsCoord, false);
        showToast("현재 GPS 위치가 Point B로 지정되었습니다.");
      }
    };
    document.getElementById('clearGps').onclick = () => {
      if (markerGps) { map.removeLayer(markerGps); markerGps = null; }
      gpsCoord = null;
      document.getElementById('gpsActionGroup').style.display = 'none';
    };
    document.getElementById('stopAnalysis').onclick = () => { isCancelled = true; document.getElementById('loading-overlay').style.display = 'none'; };

    function latLngToTilePixel(lat, lng, zoom) {
      const n = Math.pow(2, zoom);
      const x = ((lng + 180) / 360) * n;
      const latRad = (lat * Math.PI) / 180;
      const y = ((1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2) * n;
      return { tileX: Math.floor(x), tileY: Math.floor(y), pixelX: Math.floor((x - Math.floor(x)) * 256), pixelY: Math.floor((y - Math.floor(y)) * 256) };
    }

    const tileCache = new Map();
    function loadDemTile(z, x, y) {
      const key = `${z}/${x}/${y}`;
      if (tileCache.has(key)) return tileCache.get(key);
      const promise = new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = "Anonymous";
        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = 256; canvas.height = 256;
          const ctx = canvas.getContext('2d', { willReadFrequently: true });
          ctx.drawImage(img, 0, 0);
          try { resolve(ctx.getImageData(0, 0, 256, 256).data); } catch (e) { reject(e); }
        };
        img.onerror = () => reject(new Error("Tile load failed"));
        img.src = `https://s3.amazonaws.com/elevation-tiles-prod/terrarium/${z}/${x}/${y}.png`;
      });
      tileCache.set(key, promise);
      return promise;
    }

    async function fetchElevationFromDEM(points, distMeters) {
      const zoom = distMeters > 40000 ? 11 : 12;
      const pointCoords = points.map(p => latLngToTilePixel(p.lat, p.lng, zoom));
      const uniqueTiles = new Map();
      pointCoords.forEach(c => {
        const key = `${zoom}/${c.tileX}/${c.tileY}`;
        if (!uniqueTiles.has(key)) uniqueTiles.set(key, { z: zoom, x: c.tileX, y: c.tileY });
      });
      const loadedData = await Promise.all(Array.from(uniqueTiles.entries()).map(async ([key, t]) => [key, await loadDemTile(t.z, t.x, t.y)]));
      const tileDataMap = new Map(loadedData);
      return pointCoords.map((c, idx) => {
        const data = tileDataMap.get(`${zoom}/${c.tileX}/${c.tileY}`);
        const pIdx = (c.pixelY * 256 + c.pixelX) * 4;
        const elevation = (data[pIdx] * 256 + data[pIdx + 1] + data[pIdx + 2] / 256) - 32768;
        return { lat: points[idx].lat, lng: points[idx].lng, elevation: Math.max(elevation, -100) };
      });
    }

    document.getElementById('checkLOS').onclick = async () => {
      if (!aCoord || !bCoord) return showToast("A지점과 B지점을 먼저 지정하세요.");
      isCancelled = false;
      const overlay = document.getElementById('loading-overlay');
      overlay.style.display = 'flex';

      if (losLine) map.removeLayer(losLine);
      clearPointC();
      losLine = L.polyline([aCoord, bCoord], {color:'cyan', weight:2, dashArray:'5,5'}).addTo(map);

      const distanceMeters = aCoord.distanceTo(bCoord);
      const samples = Math.min(Math.max(10, Math.ceil(distanceMeters / 10)), 15000);
      document.getElementById('sub-status').innerText = `AWS 위성 타일 수신 중... (${samples.toLocaleString()}구간)`;

      const points = [];
      for(let i=0; i<=samples; i++) {
        points.push({ lat: aCoord.lat + (bCoord.lat - aCoord.lat)*(i/samples), lng: aCoord.lng + (bCoord.lng - aCoord.lng)*(i/samples) });
      }

      try {
        const results = await fetchElevationFromDEM(points, distanceMeters);
        if (isCancelled) return;
        overlay.style.display = 'none';
        cachedResults = results;
        cachedDistMeters = distanceMeters;

        document.getElementById('label-elevation-a').innerText = `${Math.round(results[0].elevation)}m`;
        document.getElementById('label-elevation-b').innerText = `${Math.round(results[results.length - 1].elevation)}m`;

        drawProfile();
      } catch(err) {
        if (!isCancelled) showToast("고도 데이터 수신에 실패했습니다.");
        overlay.style.display = 'none';
      }
    };

    function drawProfile(activeIndex = null) {
      if (!cachedResults) return;
      const results = cachedResults;
      const distMeters = cachedDistMeters;
      const canvas = document.getElementById('los-canvas');
      const ctx = canvas.getContext('2d');
      const W = canvas.width;
      const H = canvas.height;
      document.getElementById('los-popup').style.display = 'block';

      const distKm = (distMeters / 1000).toFixed(2);
      const N = results.length;
      const intervals = N - 1;
      const stepMeters = (distMeters / intervals).toFixed(2);

      document.getElementById('dist-info').innerText = `거리: ${distKm} km / ${intervals.toLocaleString()}구간 (${stepMeters}m 간격)`;

      const R_eff = 6371000 * (4/3);
      const curvedElevations = results.map((r, i) => {
        const d1 = (i / (N - 1)) * distMeters;
        return r.elevation - ((d1 * (distMeters - d1)) / (2 * R_eff));
      });

      const maxE = Math.max(...curvedElevations) + 25;
      const minE = Math.min(...curvedElevations) - 15;
      const range = Math.max(maxE - minE, 20);

      ctx.clearRect(0, 0, W, H);

      ctx.beginPath();
      ctx.fillStyle = "rgba(40, 167, 69, 0.18)";
      curvedElevations.forEach((e, i) => {
        const x = (i / (N - 1)) * W;
        const y = H - ((e - minE) / range) * (H - 40) - 20;
        if(i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      });
      ctx.lineTo(W, H); ctx.lineTo(0, H);
      ctx.fill();

      ctx.beginPath();
      ctx.strokeStyle = "#2e7d32";
      ctx.lineWidth = 2.5;
      curvedElevations.forEach((e, i) => {
        const x = (i / (N - 1)) * W;
        const y = H - ((e - minE) / range) * (H - 40) - 20;
        if(i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      });
      ctx.stroke();

      const antennaHeight = 10;
      const curvedElevA_Antenna = curvedElevations[0] + antennaHeight;
      const curvedElevB_Antenna = curvedElevations[N - 1] + antennaHeight;

      const terrainStartY = H - ((curvedElevations[0] - minE) / range) * (H - 40) - 20;
      const terrainEndY = H - ((curvedElevations[N - 1] - minE) / range) * (H - 40) - 20;

      const antennaStartY = H - ((curvedElevA_Antenna - minE) / range) * (H - 40) - 20;
      const antennaEndY = H - ((curvedElevB_Antenna - minE) / range) * (H - 40) - 20;

      ctx.beginPath();
      ctx.strokeStyle = "#111";
      ctx.lineWidth = 3;
      ctx.moveTo(0, terrainStartY);
      ctx.lineTo(0, antennaStartY);
      ctx.moveTo(W, terrainEndY);
      ctx.lineTo(W, antennaEndY);
      ctx.stroke();

      let isBlocked = false;
      for (let i = 1; i < N - 1; i++) {
        const ratio = i / (N - 1);
        const losY = antennaStartY + (antennaEndY - antennaStartY) * ratio;
        const terrainY = H - ((curvedElevations[i] - minE) / range) * (H - 40) - 20;
        if (terrainY < losY - 1) { isBlocked = true; break; }
      }

      ctx.beginPath();
      ctx.strokeStyle = isBlocked ? "#d9534f" : "#0275d8";
      ctx.lineWidth = 2.5;
      ctx.setLineDash([6, 4]);
      ctx.moveTo(0, antennaStartY);
      ctx.lineTo(W, antennaEndY);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.beginPath();
      ctx.fillStyle = "red";
      ctx.arc(0, antennaStartY, 6, 0, 2 * Math.PI);
      ctx.fill();
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.beginPath();
      ctx.fillStyle = "blue";
      ctx.arc(W, antennaEndY, 6, 0, 2 * Math.PI);
      ctx.fill();
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 2;
      ctx.stroke();

      const badgeSpan = document.getElementById('los-status-badge');
      if (isBlocked) {
        badgeSpan.className = "status-badge status-blocked";
        badgeSpan.innerText = "시계 차폐 (Blocked)";
      } else {
        badgeSpan.className = "status-badge status-clear";
        badgeSpan.innerText = "통신/시계 확보 (Clear)";
      }

      const infoBar = document.getElementById('selected-info-bar');
      const clearCBtn = document.getElementById('clearCBtn');

      if (activeIndex !== null && activeIndex >= 0 && activeIndex < N) {
        const r = results[activeIndex];
        const dFromA = (activeIndex / (N - 1)) * distMeters;
        const dFromB = distMeters - dFromA;
        const terrainY = H - ((curvedElevations[activeIndex] - minE) / range) * (H - 40) - 20;
        const xPos = (activeIndex / (N - 1)) * W;

        ctx.beginPath();
        ctx.strokeStyle = "#ff9800";
        ctx.lineWidth = 2;
        ctx.moveTo(xPos, 0);
        ctx.lineTo(xPos, H);
        ctx.stroke();

        ctx.beginPath();
        ctx.fillStyle = "#ff9800";
        ctx.arc(xPos, terrainY, 6, 0, 2 * Math.PI);
        ctx.fill();
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.font = "bold 20px sans-serif";
        ctx.fillStyle = "#e65100";
        const labelText = "C지점";
        const textWidth = ctx.measureText(labelText).width;
        const labelX = (xPos + textWidth + 15 > W) ? xPos - textWidth - 10 : xPos + 10;
        const labelY = Math.max(24, terrainY - 12);
        ctx.fillText(labelText, labelX, labelY);

        let pointMgrs = "-";
        try {
          pointMgrs = mgrs.forward([r.lng, r.lat], 5);
        } catch(e) {
          pointMgrs = "좌표 계산 불가";
        }

        let blockedFromA = false;
        if (activeIndex > 0) {
          const antennaA_Y = antennaStartY;
          const targetY = H - ((curvedElevations[activeIndex] - minE) / range) * (H - 40) - 20;
          for (let i = 1; i < activeIndex; i++) {
            const ratio = i / activeIndex;
            const lineY = antennaA_Y + (targetY - antennaA_Y) * ratio;
            const terrY = H - ((curvedElevations[i] - minE) / range) * (H - 40) - 20;
            if (terrY < lineY - 1) { blockedFromA = true; break; }
          }
        }

        let blockedFromB = false;
        if (activeIndex < N - 1) {
          const startIdx = activeIndex;
          const totalSteps = (N - 1) - startIdx;
          const startY = H - ((curvedElevations[startIdx] - minE) / range) * (H - 40) - 20;
          const antennaB_Y = antennaEndY;
          for (let step = 1; step < totalSteps; step++) {
            const i = startIdx + step;
            const ratio = step / totalSteps;
            const lineY = startY + (antennaB_Y - startY) * ratio;
            const terrY = H - ((curvedElevations[i] - minE) / range) * (H - 40) - 20;
            if (terrY < lineY - 1) { blockedFromB = true; break; }
          }
        }

        const aStatusStr = blockedFromA ? '<span style="color:#d9534f; font-weight:bold;">[차폐]</span>' : '<span style="color:#2e7d32; font-weight:bold;">[확보]</span>';
        const bStatusStr = blockedFromB ? '<span style="color:#d9534f; font-weight:bold;">[차폐]</span>' : '<span style="color:#2e7d32; font-weight:bold;">[확보]</span>';

        infoBar.innerHTML =
          `<span style="color:#ff9800; font-weight:bold;">● C지점</span> &nbsp;|&nbsp; ` +
          `<span style="color:#d9534f">고도: <b>${Math.round(r.elevation)}m</b></span> &nbsp;|&nbsp; ` +
          `<span style="color:#0056b3">MGRS: <b>${pointMgrs}</b></span><br>` +
          `<span style="color:#333">A에서: <b>${(dFromA>=1000?(dFromA/1000).toFixed(2)+'km':Math.round(dFromA)+'m')}</b> ${aStatusStr}</span> &nbsp;|&nbsp; ` +
          `<span style="color:#333">B에서: <b>${(dFromB>=1000?(dFromB/1000).toFixed(2)+'km':Math.round(dFromB)+'m')}</b> ${bStatusStr}</span>`;

        if (clearCBtn) clearCBtn.style.display = 'inline-block';

        if (!scrubMarker) {
          scrubMarker = L.circleMarker([r.lat, r.lng], {radius:7, color:'#ff9800', fillColor:'#ff9800', fillOpacity:1, weight:2}).addTo(map);
        } else {
          scrubMarker.setStyle({color: '#ff9800', fillColor: '#ff9800'});
          scrubMarker.setLatLng([r.lat, r.lng]);
        }
      } else {
        infoBar.innerHTML = `💡 그래프를 터치하거나 드래그하여<br>특정 지점(<span style="color:#ff9800; font-weight:bold;">C지점</span>)의 고도와 거리를 확인하세요`;
        if (clearCBtn) clearCBtn.style.display = 'none';
      }
    }

    const canvas = document.getElementById('los-canvas');
    let isDraggingCanvas = false;

    function handleCanvasPointer(e) {
      if (!cachedResults) return;
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const xRel = clientX - rect.left;
      const ratio = Math.max(0, Math.min(1, xRel / rect.width));
      persistentIndex = Math.round(ratio * (cachedResults.length - 1));
      drawProfile(persistentIndex);
    }

    canvas.addEventListener('mousedown', (e) => { isDraggingCanvas = true; handleCanvasPointer(e); });
    window.addEventListener('mousemove', (e) => { if (isDraggingCanvas) handleCanvasPointer(e); });
    window.addEventListener('mouseup', () => { isDraggingCanvas = false; });

    canvas.addEventListener('touchstart', (e) => { isDraggingCanvas = true; handleCanvasPointer(e); e.preventDefault(); }, { passive: false });
    window.addEventListener('touchmove', (e) => { if (isDraggingCanvas) { handleCanvasPointer(e); e.preventDefault(); } }, { passive: false });
    window.addEventListener('touchend', () => { isDraggingCanvas = false; });
  }

  // DOM이 준비되자마자 지도 로딩을 기다리지 않고 방문자 배지 즉시 표시
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', loadVisitorStats);
  } else {
    loadVisitorStats();
  }

  window.addEventListener('load', initDohaLosApp);
  document.addEventListener('DOMContentLoaded', initDohaLosApp);
</script>
</body>
</html>
